<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Workout AI</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workout AI" />
  <link rel="apple-touch-icon" href="icon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <link rel="shortcut icon" href="icon.png" type="image/png">
  <script>
    const manifest = {
      "short_name": "Workout AI",
      "name": "Workout AI",
      "icons": [{"src": "icon.png", "type": "image/png", "sizes": "512x512"}],
      "start_url": ".?v=" + Date.now(),
      "background_color": "#f3f4f6",
      "theme_color": "#b83048",
      "display": "standalone",
      "orientation": "portrait"
    };
    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
  </script>

  <style>
    /* 🌟 글로벌 충돌 방지: 드래그 중 텍스트 선택 및 하이라이트 원천 차단 */
    body {
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }
    
    /* 🌟 드래그 대상 아이템 기본 설정 (모바일 기본 스크롤과 충돌 방지) */
    .drag-item {
      touch-action: pan-y; /* 꾹 누르기 전엔 부드러운 y축 스크롤 허용 */
      -webkit-user-drag: none;
    }

    /* 🌟 활성화 시 touch-action을 제거하여 브라우저 스크롤을 완전히 잠금 */
    .drag-item.ready-to-drag {
      touch-action: none !important;
      transform: scale(1.03);
      box-shadow: 0 15px 30px -5px rgba(184, 48, 72, 0.2), 0 10px 15px -6px rgba(184, 48, 72, 0.2);
      border-color: #b83048 !important;
      background-color: #fff5f6 !important;
      z-index: 50;
      position: relative;
    }
  </style>
</head>
<body class="bg-[#f3f4f6] text-[#111827]">

  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo, useRef } = React;
    const e = React.createElement;

    const WEEK_DAYS = ["월", "화", "수", "목", "금", "토", "일"];

    const DEFAULT_ROUTINE = {
      "월": [
        { name: "랫풀다운", sets: "40 x 10 · 50 x 10 · 60 x 10" },
        { name: "바벨 로우", sets: "40 x 14 · 60 x 10 · 60 x 10 · 40 x 10" },
        { name: "원암 덤벨 로우", sets: "20 x 14 · 24 x 8 · 20 x 12" },
        { name: "스트레이트 암 풀다운", sets: "3세트 x 12~15회" },
        { name: "시티드 로우", sets: "40 x 10 · 50 x 10 · 60 x 10 · 70 x 3" },
        { name: "원암 시티드 로우", sets: "40 x 10 · 60 x 10 · 40 x 10" }
      ],
      "화": [
        { name: "[삼두] 사이드 케이블 킥백", sets: "10 x 10 · 15 x 10 · 15 x 10 · 10 x 10" },
        { name: "[삼두] 브이바 케이블 푸쉬다운", sets: "40 x 12 · 50 x 10 · 60 x 8 · 50 x 10" },
        { name: "[삼두] 케이블 킥백", sets: "10 x 10 · 5 x 12" },
        { name: "[이두] 프리처 컬 머신", sets: "50 x 10 · 60 x 10 · 70 x 5" },
        { name: "[이두] 원암 프리처 컬 머신", sets: "25 x 10 · 20 x 10 · 20 x 10" },
        { name: "[이두] 해머 컬", sets: "14 x 10 · 12 x 10 · 12 x 10 · 12 x 10 · 10 x 10" },
        { name: "[이두] 덤벨 컬", sets: "12 x 10 · 12 x 10" },
        { name: "[전완] 리스트 컬 UP", sets: "5 x 10 · 5 x 10" },
        { name: "[전완] 리스트 컬 DOWN", sets: "5 x 10 · 5 x 10" }
      ],
      "수": [],
      "목": [
        { name: "케이블 사이드 레터럴 레이즈", sets: "5 x 12 · 5 x 10 · 5 x 10 · 5 x 10 · 5 x 10" },
        { name: "머신 숄더 프레스", sets: "30 x 10 · 40 x 10 · 50 x 8" },
        { name: "덤벨 숄더 프레스", sets: "8 x 10 · 16 x 10 · 20 x 8" },
        { name: "덤벨 후면 레이즈", sets: "14 x 12 · 14 x 12" }
      ],
      "금": [
        { name: "인클라인 덤벨 프레스", sets: "10 x 10 · 16 x 10 · 20 x 10" },
        { name: "체스트 프레스", sets: "40 x 10 · 40 x 10" },
        { name: "머신 체스트 플라이", sets: "30 x 10 · 40 x 10" }
      ],
      "토": [
        { name: "아웃타이", sets: "40 x 10 · 50 x 10" },
        { name: "이너타이", sets: "40 x 12 · 50 x 10" },
        { name: "레그프레스", sets: "40 x 10 · 120 x 10 · 160 x 10 · 200 x 10 · 120 x 10" },
        { name: "레그 익스텐션", sets: "40 x 12 · 50 x 10 · 60 x 10" },
        { name: "원 레그 익스텐션", sets: "20 x 10 · 20 x 8" },
        { name: "레그컬", sets: "40 x 12 · 50 x 10 · 60 x 10" }
      ],
      "일": []
    };

    function formatDateKey(date) {
      return date.getFullYear() + "-" + 
             String(date.getMonth() + 1).padStart(2, "0") + "-" + 
             String(date.getDate()).padStart(2, "0");
    }

    function WorkoutAI() {
      const today = new Date();
      const todayKey = formatDateKey(today);

      const [page, setPage] = useState("home");
      const [calendarDate, setCalendarDate] = useState(new Date());
      const [selectedDay, setSelectedDay] = useState(WEEK_DAYS[(today.getDay() + 6) % 7]);

      // ───────────────────────────────────────────
      // ⏱️ 상태 및 참조 변수 고도화
      // ───────────────────────────────────────────
      const [draggedIndex, setDraggedIndex] = useState(null);
      const [isReadyToMove, setIsReadyToMove] = useState(false); 
      const longPressTimer = useRef(null);
      const isMovingRef = useRef(false); // 무한 루프 스왑 방지 플래그

      useEffect(function() {
        const currentVersion = "v2026.06.15_collision_fixed"; 
        const savedVersion = localStorage.getItem("app-version");
        if (savedVersion !== currentVersion) {
          localStorage.setItem("app-version", currentVersion);
          window.location.reload(true);
        }
      }, []);

      const [routineData, setRoutineData] = useState(function() {
        const saved = localStorage.getItem("routine-data-v1");
        return saved ? JSON.parse(saved) : DEFAULT_ROUTINE;
      });

      const [historyData, setHistoryData] = useState(function() {
        const saved = localStorage.getItem("history-data-v1");
        return saved ? JSON.parse(saved) : {};
      });

      const [modalOpen, setModalOpen] = useState(false);
      const [editingIndex, setEditingIndex] = useState(null);
      const [exerciseName, setExerciseName] = useState("");
      const [exerciseSets, setExerciseSets] = useState("");

      useEffect(function() {
        localStorage.setItem("routine-data-v1", JSON.stringify(routineData));
      }, [routineData]);

      useEffect(function() {
        localStorage.setItem("history-data-v1", JSON.stringify(historyData));
      }, [historyData]);

      const currentRoutine = routineData[selectedDay] || [];
      const currentHistory = (historyData[todayKey] && historyData[todayKey][selectedDay]) || [];

      const routineWithCompletion = currentRoutine.map(function(exercise, index) {
        return Object.assign({}, exercise, {
          completed: (currentHistory[index] && currentHistory[index].completed) || false
        });
      });

      const completedCount = routineWithCompletion.filter(function(item) { return item.completed; }).length;
      const dailyPercent = routineWithCompletion.length === 0 ? 0 : Math.round((completedCount / routineWithCompletion.length) * 100);

      const toggleComplete = function(index) {
        const dayData = (historyData[todayKey] && historyData[todayKey][selectedDay]) || [];
        const updated = [].concat(dayData);
        updated[index] = { completed: !(updated[index] && updated[index].completed) };

        const newDaySection = Object.assign({}, historyData[todayKey] || {}, { [selectedDay]: updated });
        setHistoryData(Object.assign({}, historyData, { [todayKey]: newDaySection }));
      };

      // ───────────────────────────────────────────
      // 📱 완벽한 롱프레스 터치 트래킹 시스템
      // ───────────────────────────────────────────
      const handleTouchStart = function(e, index) {
        // 버튼이나 입력 폼 요소 클릭 시 동작 방지
        if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;

        // 기존 타이머 클리어
        if (longPressTimer.current) clearTimeout(longPressTimer.current);

        setDraggedIndex(index);
        setIsReadyToMove(false);
        isMovingRef.current = false;

        // 450ms 동안 홀딩 시 드래그 모드 잠금 해제
        longPressTimer.current = setTimeout(function() {
          setIsReadyToMove(true);
          if (navigator.vibrate) navigator.vibrate(40); // 정렬 준비 알림 진동
        }, 450);
      };

      const handleTouchMove = function(e) {
        if (longPressTimer.current && !isReadyToMove) {
          // 꾹 누르기 전에 손가락이 위아래로 일정량 이상 밀리면 롱프레스 취소 (일반 스크롤로 간주)
          clearTimeout(longPressTimer.current);
          return;
        }

        // 롱프레스가 활성화된 이후에는 브라우저 화면 스크롤을 무조건 차단
        if (isReadyToMove && draggedIndex !== null) {
          if (e.cancelable) e.preventDefault();

          const touchY = e.touches[0].clientY;
          const touchX = e.touches[0].clientX;
          
          // 손가락 좌표 하단의 엘리먼트 추적
          const targetElement = document.elementFromPoint(touchX, touchY);
          if (!targetElement) return;

          const itemElement = targetElement.closest('[data-drag-index]');
          if (!itemElement) return;

          const targetIndex = parseInt(itemElement.getAttribute('data-drag-index'), 10);
          
          // 유효 인덱스 검증 및 무한 핑퐁 스왑 제어
          if (isNaN(targetIndex) || targetIndex === draggedIndex || isMovingRef.current) return;

          isMovingRef.current = true;

          const list = [].concat(routineData[selectedDay]);
          const draggedItem = list[draggedIndex];
          
          list.splice(draggedIndex, 1);
          list.splice(targetIndex, 0, draggedItem);
          
          setDraggedIndex(targetIndex);
          setRoutineData(Object.assign({}, routineData, { [selectedDay]: list }));

          // 스왑 완료 후 플래그 해제하여 프레임 지연 확보
          setTimeout(function() {
            isMovingRef.current = false;
          }, 50);
        }
      };

      const handleTouchEnd = function() {
        if (longPressTimer.current) clearTimeout(longPressTimer.current);
        setDraggedIndex(null);
        setIsReadyToMove(false);
        isMovingRef.current = false;
      };

      // PC 마우스 드래그 이벤트 보완
      const handleDragStart = function(index) {
        setDraggedIndex(index);
        setIsReadyToMove(true);
      };

      const handleDragOver = function(e, index) {
        e.preventDefault();
        if (draggedIndex === null || draggedIndex === index) return;

        const list = [].concat(routineData[selectedDay]);
        const draggedItem = list[draggedIndex];
        list.splice(draggedIndex, 1);
        list.splice(index, 0, draggedItem);
        
        setDraggedIndex(index);
        setRoutineData(Object.assign({}, routineData, { [selectedDay]: list }));
      };

      const currentMonth = calendarDate.getMonth();
      const currentYear = calendarDate.getFullYear();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const currentMonthLabel = currentYear + "년 " + (currentMonth + 1) + "월";

      const completedDaysCount = useMemo(function() {
        return Object.keys(historyData).filter(function(dateKey) {
          const date = new Date(dateKey);
          if (!(date.getMonth() === currentMonth && date.getFullYear() === currentYear)) return false;
          const dayData = historyData[dateKey];
          return Object.values(dayData).some(function(items) {
            return items.some(function(item) { return item.completed; });
          });
        }).length;
      }, [historyData, currentMonth, currentYear]);

      const monthPercent = Math.round((completedDaysCount / daysInMonth) * 100);

      const openAddModal = function() {
        setEditingIndex(null); setExerciseName(""); setExerciseSets(""); setModalOpen(true);
      };

      const openEditModal = function(exercise, index) {
        setEditingIndex(index); setExerciseName(exercise.name); setExerciseSets(exercise.sets); setModalOpen(true);
      };

      const saveExercise = function() {
        if (!exerciseName || !exerciseSets) return;
        if (editingIndex === null) {
          const updatedList = [].concat(routineData[selectedDay] || [], [{ name: exerciseName, sets: exerciseSets }]);
          setRoutineData(Object.assign({}, routineData, { [selectedDay]: updatedList }));
        } else {
          const updatedList = (routineData[selectedDay] || []).map(function(item, idx) {
            return idx === editingIndex ? { name: exerciseName, sets: exerciseSets } : item;
          });
          setRoutineData(Object.assign({}, routineData, { [selectedDay]: updatedList }));
        }
        setModalOpen(false);
      };

      const deleteExercise = function(index) {
        const updatedList = (routineData[selectedDay] || []).filter(function(_, idx) { return idx !== index; });
        setRoutineData(Object.assign({}, routineData, { [selectedDay]: updatedList }));
      };

      return e('div', { className: 'min-h-screen pb-40' },
        e('div', { className: 'max-w-md mx-auto p-5 space-y-5' },
          e('div', null,
            e('h1', { className: 'text-3xl font-black text-[#b83048]' }, 'Workout AI'),
            e('p', { className: 'text-sm text-gray-500 mt-1' }, '주간 고볼륨 웨이트 트레이닝 루틴 리포트')
          ),

          page === "home" && e('div', { className: 'space-y-5' },
            e('div', { className: 'grid grid-cols-7 gap-2' },
              WEEK_DAYS.map(function(day) {
                return e('button', {
                  key: day,
                  onClick: function() { setSelectedDay(day); },
                  className: 'h-12 rounded-2xl border text-sm font-black ' + (selectedDay === day ? 'bg-[#b83048] text-white border-[#b83048]' : 'bg-white text-[#b83048] border-[#e7c2ca]')
                }, day);
              })
            ),
            e('div', { className: 'bg-white rounded-[28px] border border-gray-200 p-5' },
              e('div', { className: 'flex items-center justify-between mb-5' },
                e('div', null,
                  e('h2', { className: 'text-2xl font-black' }, selectedDay + '요일 루틴'),
                  e('p', { className: 'text-xs text-gray-400 mt-1 font-bold' }, '🔥 카드를 0.5초간 꾹 누르면 위아래로 정렬됩니다.')
                ),
                e('div', { className: 'text-[#b83048] text-xl font-black ml-2 shrink-0' }, completedCount + '/' + routineWithCompletion.length)
              ),
              routineWithCompletion.length === 0 && e('div', { className: 'rounded-3xl bg-[#f8f8f8] p-6 text-center text-sm text-gray-500 font-semibold' }, '휴식일 (스트레칭 및 리커버리)'),
              
              e('div', { className: 'space-y-3 relative' },
                routineWithCompletion.map(function(exercise, index) {
                  const isDraggingThis = draggedIndex === index && isReadyToMove;
                  return e('div', {
                    key: index,
                    'data-drag-index': index,
                    draggable: true,
                    onDragStart: function() { handleDragStart(index); },
                    onDragOver: function(e) { handleDragOver(e, index); },
                    onDragEnd: handleTouchEnd,
                    onTouchStart: function(e) { handleTouchStart(e, index); },
                    onTouchMove: handleTouchMove,
                    onTouchEnd: handleTouchEnd,
                    onTouchCancel: handleTouchEnd,
                    className: 'drag-item rounded-3xl border p-4 transition-all duration-200 select-none ' + 
                               (exercise.completed ? 'bg-green-50 border-green-300' : 'bg-white border-gray-200 ') +
                               (isDraggingThis ? ' ready-to-drag' : '')
                  },
                    e('div', { className: 'flex items-start justify-between pointer-events-none' },
                      e('div', null,
                        e('div', { className: 'flex items-center gap-2' },
                          e('span', { className: 'text-xs bg-gray-100 text-gray-400 font-bold px-1.5 py-0.5 rounded-md' }, index + 1),
                          e('h3', { className: 'font-black text-sm text-gray-900' }, exercise.name)
                        ),
                        e('p', { className: 'text-xs text-gray-500 mt-2 pl-6' }, exercise.sets)
                      ),
                      e('button', {
                        onClick: function(e) { 
                          e.stopPropagation(); 
                          toggleComplete(index); 
                        },
                        className: 'w-7 h-7 rounded-full flex items-center justify-center text-sm font-black transition-colors pointer-events-auto ' + (exercise.completed ? 'bg-green-600 text-white' : 'border-2 border-dotted border-[#b83048] text-transparent')
                      }, '✔')
                    )
                  );
                })
              )
            )
          ),

          page === "calendar" && e('div', { className: 'bg-white rounded-[28px] border border-gray-200 p-5' },
            e('div', { className: 'flex items-center justify-between mb-5' },
              e('button', { onClick: function() { setCalendarDate(new Date(currentYear, currentMonth - 1, 1)); }, className: 'w-10 h-10 rounded-2xl border bg-white' }, '←'),
              e('div', { className: 'text-center' },
                e('h2', { className: 'text-2xl font-black' }, currentMonthLabel),
                e('p', { className: 'text-sm text-[#b83048]' + ' font-bold' }, '월간 수행률 ' + monthPercent + '%')
              ),
              e('button', { onClick: function() { setCalendarDate(new Date(currentYear, currentMonth + 1, 1)); }, className: 'w-10 h-10 rounded-2xl border bg-white' }, '→')
            ),
            e('div', { className: 'grid grid-cols-7 gap-2' },
              Array.from({ length: daysInMonth }).map(function(_, index) {
                const dayNumber = index + 1;
                const dateKey = currentYear + "-" + String(currentMonth + 1).padStart(2, "0") + "-" + String(dayNumber).padStart(2, "0");
                const dayCompleted = historyData[dateKey];
                const completed = !!dayCompleted && Object.values(dayCompleted).some(function(items) {
                  return items.some(function(item) { return item.completed; });
                });
                const isToday = today.getDate() === dayNumber && today.getMonth() === currentMonth && today.getFullYear() === currentYear;

                return e('div', {
                  key: index,
                  className: 'aspect-square rounded-2xl border flex items-center justify-center text-sm font-bold relative ' + 
                               (completed ? 'bg-[#b83048] text-white border-[#b83048]' : 'bg-[#f8f8f8] border-gray-200 text-gray-500') + 
                               (isToday ? ' ring-4 ring-[#b83048]/30' : '')
                }, dayNumber, isToday && e('div', { className: 'absolute top-1 right-1 w-2 h-2 rounded-full bg-white' }));
              })
            )
          ),

          page === "settings" && e('div', { className: 'bg-white rounded-[28px] border border-gray-200 p-5 space-y-4' },
            e('div', { className: 'flex items-center justify-between' },
              e('h2', { className: 'text-2xl font-black' }, '루틴 설정'),
              e('button', { onClick: openAddModal, className: 'px-4 h-11 rounded-2xl bg-[#b83048] text-white text-sm font-black' }, '추가')
            ),
            e('div', { className: 'grid grid-cols-7 gap-2' },
              WEEK_DAYS.map(function(day) {
                return e('button', {
                  key: day,
                  onClick: function() { setSelectedDay(day); },
                  className: 'h-11 rounded-2xl border text-xs font-black ' + (selectedDay === day ? 'bg-[#b83048] text-white border-[#b83048]' : 'bg-white text-[#b83048] border-[#e7c2ca]')
                }, day);
              })
            ),
            e('div', { className: 'space-y-3' },
              currentRoutine.map(function(exercise, index) {
                return e('div', { key: index, className: 'rounded-3xl bg-[#f8f8f8] border border-gray-200 p-4 flex items-center justify-between' },
                  e('div', null,
                    e('p', { className: 'font-black text-sm' }, exercise.name),
                    e('p', { className: 'text-xs text-gray-500 mt-1' }, exercise.sets)
                  ),
                  e('div', { className: 'flex gap-2' },
                    e('button', { onClick: function() { openEditModal(exercise, index); }, className: 'px-3 h-10 rounded-2xl bg-blue-500 text-white text-xs font-black' }, '수정'),
                    e('button', { onClick: function() { deleteExercise(index); }, className: 'px-3 h-10 rounded-2xl bg-red-500 text-white text-xs font-black' }, '삭제')
                  )
                );
              })
            )
          )
        ),

        e('div', { className: 'fixed bottom-0 left-0 right-0 bg-white/95 border-t border-gray-200 pt-3 pb-8 px-4 z-40' },
          e('div', { className: 'max-w-md mx-auto grid grid-cols-3 gap-3' },
            [
              ["home", "홈"],
              ["calendar", "캘린더"],
              ["settings", "설정"]
            ].map(function([key, label]) {
              return e('button', {
                key: key,
                onClick: function() { setPage(key); },
                className: 'h-16 rounded-3xl border text-sm font-black ' + (page === key ? 'bg-[#b83048] text-white border-[#b83048]' : 'bg-white text-[#b83048] border-[#e7c2ca]')
              }, label);
            })
          )
        ),

        modalOpen && e('div', { className: 'fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-5' },
          e('div', { className: 'bg-white rounded-[32px] w-full max-w-sm p-5 space-y-4' },
            e('h2', { className: 'text-2xl font-black' }, '운동 설정'),
            e('input', { value: exerciseName, onChange: function(e) { setExerciseName(e.target.value); }, placeholder: '운동 이름', className: 'w-full h-14 rounded-2xl border border-gray-200 px-4 outline-none' }),
            e('input', { value: exerciseSets, onChange: function(e) { setExerciseSets(e.target.value); }, placeholder: '세트 및 횟수', className: 'w-full h-14 rounded-2xl border border-gray-200 px-4 outline-none' }),
            e('button', { onClick: saveExercise, className: 'w-full h-14 rounded-2xl bg-[#b83048] text-white font-black' }, '저장')
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(WorkoutAI));
  </script>
</body>
</html>
