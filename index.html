<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Workout AI</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workout AI" />
  <link rel="apple-touch-icon" href="icon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <link rel="shortcut icon" href="icon.png" type="image/png">
  <script>
    const manifest = {
      "short_name": "Workout AI",
      "name": "Workout AI",
      "icons": [{"src": "icon.png", "type": "image/png", "sizes": "512x512"}],
      "start_url": ".",
      "background_color": "#efefef",
      "theme_color": "#b83048",
      "display": "standalone",
      "orientation": "portrait"
    };
    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
  </script>

  <style>
    body {
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body class="bg-[#efefef]">

  <div id="root"></div>

  <script>
    const { useState } = React;
    const e = React.createElement;

    function App() {
      const [page, setPage] = useState('home');
      const [selectedDay, setSelectedDay] = useState('월');
      const [routineData, setRoutineData] = useState({
        '월': { title: '등 · 광배', exercises: [{ name: '랫풀다운', sets: ['40 x 10', '50 x 10'], completed: false }] },
        '화': { title: '팔', exercises: [{ name: '브이바 푸쉬다운', sets: ['40 x 10'], completed: false }] },
        '수': { title: '휴식', exercises: [] },
        '목': { title: '어깨', exercises: [{ name: '케이블 사레레', sets: ['5 x 10'], completed: false }] },
        '금': { title: '가슴', exercises: [{ name: '벤치프레스', sets: ['60 x 10'], completed: false }] },
        '토': { title: '하체', exercises: [{ name: '레그프레스', sets: ['200 x 10'], completed: false }] },
        '일': { title: '휴식', exercises: [] },
      });

      const [showAddModal, setShowAddModal] = useState(false);
      const [showEditModal, setShowEditModal] = useState(false);
      const [editingDay, setEditingDay] = useState('월');
      const [editingIndex, setEditingIndex] = useState(0);
      const [exerciseName, setExerciseName] = useState('');
      const [exerciseSets, setExerciseSets] = useState('10 x 10');
      const [aiQuestion, setAiQuestion] = useState('');
      const [aiAnswer, setAiAnswer] = useState('AI 코치가 현재 루틴을 분석 중입니다.');

      const currentData = routineData[selectedDay];

      const toggleExercise = (index) => {
        const updated = Object.assign({}, routineData);
        updated[selectedDay].exercises[index].completed = !updated[selectedDay].exercises[index].completed;
        setRoutineData(updated);
      };

      const addExercise = () => {
        if (!exerciseName.trim()) return;
        const updated = Object.assign({}, routineData);
        updated[editingDay].exercises.push({
          name: exerciseName,
          sets: exerciseSets.split(',').map(function(v) { return v.trim(); }),
          completed: false,
        });
        setRoutineData(updated);
        setExerciseName('');
        setExerciseSets('10 x 10');
        setShowAddModal(false);
      };

      const editExercise = () => {
        if (!exerciseName.trim()) return;
        const updated = Object.assign({}, routineData);
        updated[editingDay].exercises[editingIndex] = Object.assign({}, updated[editingDay].exercises[editingIndex], {
          name: exerciseName,
          sets: exerciseSets.split(',').map(function(v) { return v.trim(); }),
        });
        setRoutineData(updated);
        setShowEditModal(false);
      };

      const deleteExercise = (day, index) => {
        const updated = Object.assign({}, routineData);
        updated[day].exercises = updated[day].exercises.filter(function(_, idx) { return idx !== index; });
        setRoutineData(updated);
      };

      return e('div', { className: 'min-h-screen pb-24' },
        e('div', { className: 'max-w-md mx-auto p-4' },
          e('div', { className: 'flex items-center gap-3 mb-1' },
            e('img', { src: 'icon.png', className: 'w-10 h-10 object-contain rounded-xl' }),
            e('h1', { className: 'text-3xl font-black' }, 'Workout AI')
          ),
          e('p', { className: 'text-sm text-gray-500 mb-6' }, '루틴 · AI 분석 · 퍼포먼스'),

          page === 'home' && e('div', null,
            e('div', { className: 'grid grid-cols-7 gap-2 mb-5' },
              Object.keys(routineData).map(function(day) {
                return e('button', {
                  key: day,
                  onClick: function() { setSelectedDay(day); },
                  className: 'rounded-2xl py-3 text-sm font-bold border ' + (selectedDay === day ? 'bg-[#b83048] text-white border-[#b83048]' : 'bg-white border-gray-200')
                }, day);
              })
            ),
            e('div', { className: 'bg-white rounded-3xl p-5 border border-gray-200' },
              e('h2', { className: 'text-xl font-bold mb-1' }, currentData.title),
              e('div', { className: 'space-y-3 mt-5' },
                currentData.exercises.length === 0
                  ? e('p', { className: 'text-center text-sm text-gray-400 py-8' }, '오늘은 쉬는 날입니다! 푹 쉬세요.')
                  : currentData.exercises.map(function(exercise, index) {
                      return e('div', { key: index, className: 'rounded-2xl border border-gray-200 p-4 transition-colors duration-200 ' + (exercise.completed ? 'bg-green-50 border-green-200' : 'bg-white') },
                        e('div', { className: 'flex items-start justify-between gap-3' },
                          e('div', { className: 'flex-1' },
                            /* 글씨 취소선이나 회색 변경 없이 본래 굵은 텍스트 유지 */
                            e('div', { className: 'font-semibold text-sm text-gray-900' }, exercise.name),
                            e('div', { className: 'flex flex-wrap gap-2 mt-2' },
                              exercise.sets.map(function(set, idx) {
                                /* 세트 라벨 배경도 회색으로 변하지 않고 본래의 버건디 포인트 톤 유지 */
                                return e('div', { key: idx, className: 'rounded-xl px-3 py-1 text-xs font-bold bg-[#f8e9ed] text-[#b83048]' }, set);
                              })
                            )
                          ),
                          e('button', {
                            onClick: function() { toggleExercise(index); },
                            className: 'w-6 h-6 rounded-full flex items-center justify-center text-xs font-black transition-colors ' + (exercise.completed ? 'bg-green-600 text-white border-green-600' : 'border-2 border-dotted border-[#b83048] text-[#b83048]')
                          }, '✔')
                        )
                      );
                    })
              )
            )
          ),

          page === 'calendar' && e('div', { className: 'bg-white rounded-3xl p-5 border border-gray-200' },
            e('h2', { className: 'text-xl font-bold mb-5' }, '캘린더'),
            e('div', { className: 'grid grid-cols-7 gap-2' },
              Array.from({ length: 31 }).map(function(_, idx) {
                return e('div', { key: idx, className: 'aspect-square rounded-2xl bg-gray-100 flex items-center justify-center text-sm font-bold' }, idx + 1);
              })
            )
          ),

          page === 'analysis' && e('div', { className: 'bg-white rounded-3xl p-5 border border-gray-200' },
            e('h2', { className: 'text-xl font-bold mb-4' }, 'AI 코치'),
            e('div', { className: 'rounded-2xl bg-gray-100 p-4 text-sm leading-7 min-h-[120px]' }, aiAnswer),
            e('textarea', {
              value: aiQuestion,
              onChange: function(e) { setAiQuestion(e.target.value); },
              placeholder: 'AI 코치에게 운동 루틴이나 피드백을 질문해 보세요.',
              className: 'w-full rounded-2xl border border-gray-200 p-4 mt-4 min-h-[100px] outline-none text-sm'
            }),
            e('button', {
              onClick: function() { setAiAnswer("분석 완료: 입력하신 '" + aiQuestion + "' 내용을 기반으로 정밀 근비대 피드백을 계산 중입니다."); },
              className: 'w-full rounded-2xl bg-[#b83048] py-4 text-white font-bold mt-4'
            }, 'AI 분석 요청')
          ),

          page === 'settings' && e('div', { className: 'space-y-4' },
            Object.entries(routineData).map(function([day, data]) {
              return e('div', { key: day, className: 'bg-white rounded-3xl p-5 border border-gray-200' },
                e('div', { className: 'flex items-center justify-between mb-4' },
                  e('div', null,
                    e('h2', { className: 'font-bold text-lg text-[#b83048]' }, day + '요일 루틴'),
                    e('p', { className: 'text-sm text-gray-500' }, data.title)
                  )
                ),
                e('button', {
                  onClick: function() { setEditingDay(day); setExerciseName(''); setExerciseSets('10 x 10'); setShowAddModal(true); },
                  className: 'w-full rounded-2xl border-2 border-dotted border-[#b83048] py-3 text-sm font-bold text-[#b83048]'
                }, '+ 운동 추가'),
                e('div', { className: 'space-y-2 mt-4' },
                  data.exercises.map(function(exercise, index) {
                    return e('div', { key: index, className: 'rounded-2xl bg-gray-100 p-4 flex items-center justify-between' },
                      e('div', null,
                        e('div', { className: 'font-semibold text-sm' }, exercise.name),
                        e('div', { className: 'text-xs text-gray-500 mt-1' }, exercise.sets.join(', '))
                      ),
                      e('div', { className: 'flex gap-3' },
                        e('button', { onClick: function() { setEditingDay(day); setEditingIndex(index); setExerciseName(exercise.name); setExerciseSets(exercise.sets.join(', ')); setShowEditModal(true); }, className: 'text-sm font-bold text-[#b83048]' }, '수정'),
                        e('button', { onClick: function() { deleteExercise(day, index); }, className: 'text-sm font-bold text-red-500' }, '삭제')
                      )
                    );
                  })
                )
              );
            })
          )
        ),

        e('div', { className: 'fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-4 px-4' },
          e('div', { className: 'max-w-md mx-auto grid grid-cols-4 gap-2 text-center' },
            e('button', { onClick: function() { setPage('home'); }, className: 'font-bold text-sm ' + (page === 'home' ? 'text-[#b83048]' : 'text-gray-400') }, '홈'),
            e('button', { onClick: function() { setPage('calendar'); }, className: 'font-bold text-sm ' + (page === 'calendar' ? 'text-[#b83048]' : 'text-gray-400') }, '캘린더'),
            e('button', { onClick: function() { setPage('analysis'); }, className: 'font-bold text-sm ' + (page === 'analysis' ? 'text-[#b83048]' : 'text-gray-400') }, '분석'),
            e('button', { onClick: function() { setPage('settings'); }, className: 'font-bold text-sm ' + (page === 'settings' ? 'text-[#b83048]' : 'text-gray-400') }, '설정')
          )
        ),

        showAddModal && e('div', { className: 'fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4' },
          e('div', { className: 'bg-white rounded-3xl p-5 w-full max-w-sm' },
            e('h2', { className: 'text-xl font-bold mb-4' }, '운동 추가'),
            e('input', { value: exerciseName, onChange: function(e) { setExerciseName(e.target.value); }, placeholder: '운동 이름', className: 'w-full rounded-2xl border border-gray-200 p-4 outline-none mb-3 text-sm' }),
            e('input', { value: exerciseSets, onChange: function(e) { setExerciseSets(e.target.value); }, placeholder: '40 x 10, 50 x 8', className: 'w-full rounded-2xl border border-gray-200 p-4 outline-none text-sm' }),
            e('button', { onClick: addExercise, className: 'w-full rounded-2xl bg-[#b83048] py-4 text-white font-bold mt-4' }, '완료')
          )
        ),

        showEditModal && e('div', { className: 'fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4' },
          e('div', { className: 'bg-white rounded-3xl p-5 w-full max-w-sm' },
            e('h2', { className: 'text-xl font-bold mb-4' }, '운동 수정'),
            e('input', { value: exerciseName, onChange: function(e) { setExerciseName(e.target.value); }, placeholder: '운동 이름', className: 'w-full rounded-2xl border border-gray-200 p-4 outline-none mb-3 text-sm' }),
            e('input', { value: exerciseSets, onChange: function(e) { setExerciseSets(e.target.value); }, placeholder: '40 x 10, 50 x 8', className: 'w-full rounded-2xl border border-gray-200 p-4 outline-none text-sm' }),
            e('button', { onClick: editExercise, className: 'w-full rounded-2xl bg-[#b83048] py-4 text-white font-bold mt-4' }, '완료')
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
