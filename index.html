<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Workout AI</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workout AI" />
  <link rel="apple-touch-icon" href="icon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="shortcut icon" href="icon.png" type="image/png">
  <script>
    const manifest = {
      "short_name": "Workout AI",
      "name": "Workout AI",
      "icons": [{"src": "icon.png", "type": "image/png", "sizes": "512x512"}],
      "start_url": ".",
      "background_color": "#efefef",
      "theme_color": "#b83048",
      "display": "standalone",
      "orientation": "portrait"
    };
    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
  </script>

  <style>
    body {
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body class="bg-[#efefef]">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [page, setPage] = useState('home');
      const [selectedDay, setSelectedDay] = useState('월');
      const [routineData, setRoutineData] = useState({
        월: { title: '등 · 광배', exercises: [{ name: '랫풀다운', sets: ['40 x 10', '50 x 10'], completed: false }] },
        화: { title: '팔', exercises: [{ name: '브이바 푸쉬다운', sets: ['40 x 10'], completed: false }] },
        수: { title: '휴식', exercises: [] },
        목: { title: '어깨', exercises: [{ name: '케이블 사레레', sets: ['5 x 10'], completed: false }] },
        금: { title: '가슴', exercises: [{ name: '벤치프레스', sets: ['60 x 10'], completed: false }] },
        토: { title: '하체', exercises: [{ name: '레그프레스', sets: ['160 x 10'], completed: false }] },
        일: { title: '휴식', exercises: [] },
      });

      const [showAddModal, setShowAddModal] = useState(false);
      const [showEditModal, setShowEditModal] = useState(false);
      const [editingDay, setEditingDay] = useState('월');
      const [editingIndex, setEditingIndex] = useState(0);
      const [exerciseName, setExerciseName] = useState('');
      const [exerciseSets, setExerciseSets] = useState('10 x 10');
      const [aiQuestion, setAiQuestion] = useState('');
      const [aiAnswer, setAiAnswer] = useState('AI 코치가 현재 루틴을 분석 중입니다.');

      const currentData = routineData[selectedDay];

      const toggleExercise = (index) => {
        const updated = { ...routineData };
        updated[selectedDay].exercises[index].completed = !updated[selectedDay].exercises[index].completed;
        setRoutineData(updated);
      };

      const addExercise = () => {
        if (!exerciseName.trim()) return;
        const updated = { ...routineData };
        updated[editingDay].exercises.push({
          name: exerciseName,
          sets: exerciseSets.split(',').map((v) => v.trim()),
          completed: false,
        });
        setRoutineData(updated);
        setExerciseName('');
        setExerciseSets('10 x 10');
        setShowAddModal(false);
      };

      const editExercise = () => {
        if (!exerciseName.trim()) return;
        const updated = { ...routineData };
        updated[editingDay].exercises[editingIndex] = {
          ...updated[editingDay].exercises[editingIndex],
          name: exerciseName,
          sets: exerciseSets.split(',').map((v) => v.trim()),
        };
        setRoutineData(updated);
        setShowEditModal(false);
      };

      const deleteExercise = (day, index) => {
        const updated = { ...routineData };
        updated[day].exercises = updated[day].exercises.filter((_, idx) => idx !== index);
        setRoutineData(updated);
      };

      return (
        <div class="min-h-screen pb-24">
          <div class="max-w-md mx-auto p-4">
            <div class="flex items-center gap-3 mb-1">
              <img src="icon.png" class="w-10 h-10 object-contain rounded-xl" />
              <h1 class="text-3xl font-black">Workout AI</h1>
            </div>
            <p class="text-sm text-gray-500 mb-6">루틴 · AI 분석 · 퍼포먼스</p>

            {page === 'home' && (
              <div>
                <div class="grid grid-cols-7 gap-2 mb-5">
                  {Object.keys(routineData).map((day) => (
                    <button
                      key={day}
                      onClick={() => setSelectedDay(day)}
                      class={`rounded-2xl py-3 text-sm font-bold border ${selectedDay === day ? 'bg-[#b83048] text-white border-[#b83048]' : 'bg-white border-gray-200'}`}
                    >
                      {day}
                    </button>
                  ))}
                </div>

                <div class="bg-white rounded-3xl p-5 border border-gray-200">
                  <h2 class="text-xl font-bold mb-1">{currentData.title}</h2>
                  <div class="space-y-3 mt-5">
                    {currentData.exercises.length === 0 ? (
                      <p class="text-center text-sm text-gray-400 py-8">오늘은 쉬는 날입니다! 푹 쉬세요.</p>
                    ) : (
                      currentData.exercises.map((exercise, index) => (
                        /* 완료 상태일 때 카드 배경을 투명한 초록색(bg-green-50)으로 변경 */
                        <div key={index} class={`rounded-2xl border border-gray-200 p-4 transition-colors duration-200 ${exercise.completed ? 'bg-green-50 border-green-200' : 'bg-white'}`}>
                          <div class="flex items-start justify-between gap-3">
                            <div class="flex-1">
                              <div class={`font-semibold text-sm ${exercise.completed ? 'text-gray-500 line-through' : ''}`}>{exercise.name}</div>
                              <div class="flex flex-wrap gap-2 mt-2">
                                {exercise.sets.map((set, idx) => (
                                  <div key={idx} class={`rounded-xl px-3 py-1 text-xs font-bold ${exercise.completed ? 'bg-gray-200 text-gray-500' : 'bg-f8e9ed bg-[#f8e9ed] text-[#b83048]'}`}>{set}</div>
                                ))}
                              </div>
                            </div>
                            {/* 요청하신 체크 버튼 디자인 반영 부분 */}
                            <button
                              onClick={() => toggleExercise(index)}
                              className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-black ${
                                exercise.completed
                                  ? 'bg-green-600 text-white'
                                  : 'border-2 border-dotted border-[#b83048] text-[#b83048]'
                              }`}
                            >
                              ✔
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {page === 'calendar' && (
              <div class="bg-white rounded-3xl p-5 border border-gray-200">
                <h2 class="text-xl font-bold mb-5">캘린더</h2>
                <div class="grid grid-cols-7 gap-2">
                  {Array.from({ length: 31 }).map((_, idx) => (
                    <div key={idx} class="aspect-square rounded-2xl bg-gray-100 flex items-center justify-center text-sm font-bold">{idx + 1}</div>
                  ))}
                </div>
              </div>
            )}

            {page === 'analysis' && (
              <div class="bg-white rounded-3xl p-5 border border-gray-200">
                <h2 class="text-xl font-bold mb-4">AI 코치</h2>
                <div class="rounded-2xl bg-gray-100 p-4 text-sm leading-7 min-h-[120px]">{aiAnswer}</div>
                <textarea
                  value={aiQuestion}
                  onChange={(e) => setAiQuestion(e.target.value)}
                  placeholder="AI 코치에게 운동 루틴이나 피드백을 질문해 보세요."
                  class="w-full rounded-2xl border border-gray-200 p-4 mt-4 min-h-[100px] outline-none text-
